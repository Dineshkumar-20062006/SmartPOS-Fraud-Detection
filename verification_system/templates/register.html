<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BillGuard AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .auth-container { max-width: 400px; margin: 4rem auto; padding: 2rem; }
    .auth-title { text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 700; }
    .auth-sub { text-align: center; color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .form-input { width: 100%; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 1rem; transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: var(--accent2); }
    .btn-auth { width: 100%; padding: 12px; background: linear-gradient(135deg, #00b0ff, #d500f9); color: #fff; font-weight: 700; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s; box-shadow: 0 0 20px rgba(0,176,255,0.2); margin-top: 1rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 4px 24px rgba(0,176,255,0.3); }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted); }
    .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .flash-messages { margin-bottom: 1.5rem; }
    .flash { background: rgba(255,23,68,0.1); border: 1px solid rgba(255,23,68,0.3); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner" style="justify-content: center;">
      <div class="logo">
        <span class="logo-icon">🛒</span>
        <div>
          <h1 class="logo-title">BillGuard AI</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="card auth-container">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Join BillGuard to earn credits for your bills.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" required minlength="6">
        </div>
        <button type="submit" class="btn-auth">Register</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </div>
  </main>
</body>
</html>
